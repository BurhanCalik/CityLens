# Render Blueprint for the CityLens backend.
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: citylens-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /health/live
    envVars:
      # Render injects PORT automatically; the Go config reads PORT first.
      - key: SERVER_HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: LOG_FORMAT
        value: json
      # Postgres/Redis/Kafka are optional — the server boots without them and
      # /detections is served from the embedded JSON. Add DB envs later if needed.
